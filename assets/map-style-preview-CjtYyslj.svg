<svg width="560" height="300" viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg">
  <!--
    Подложка для промо-блока «уникальных мест на карте».

    Это не скриншот, а рисунок, но палитра взята один в один из
    src/lib/mapStyle.js (PAINT_OVERRIDES) — та же кремовая земля, та же вода
    #A9D8F2, те же оранжевые шоссе с обводкой. Живую карту сюда тянуть нельзя:
    maplibre весит ~850 КБ и грузится только на /map, главная должна остаться
    лёгкой.

    Море занимает только правый край: маркеры ставятся поверх, и большое
    пустое синее пятно оставляло бы полкартинки без содержания.
  -->
  <defs>
    <clipPath id="frame">
      <rect width="560" height="300" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- земля -->
    <rect width="560" height="300" fill="#FBF7EE" />

    <!-- зелёные массивы: неправильные многоугольники, а не эллипсы -->
    <path d="M24 18 L108 6 L152 40 L146 92 L96 116 L34 104 L10 60 Z" fill="#DFEFD4" />
    <path d="M40 100 L92 112 L104 140 L74 156 L18 148 L6 118 Z" fill="#D8EACC" />
    <path d="M84 190 L164 174 L204 208 L192 268 L128 292 L74 268 L58 224 Z" fill="#DFEFD4" />
    <path d="M286 12 L372 4 L402 44 L378 84 L318 92 L272 62 Z" fill="#D8EACC" />
    <path d="M386 116 L448 106 L468 142 L438 174 L386 166 L370 138 Z" fill="#DFEFD4" />
    <path d="M248 250 L322 240 L350 274 L322 308 L254 302 Z" fill="#D8EACC" />
    <path d="M470 216 L520 208 L536 244 L508 276 L466 264 Z" fill="#DFEFD4" />

    <!-- жилые кварталы -->
    <g fill="#F5F0E4">
      <path d="M140 118 L232 110 L240 178 L150 190 Z" />
      <path d="M248 92 L332 86 L340 156 L256 164 Z" />
      <path d="M188 26 L268 20 L274 74 L194 80 Z" />
      <path d="M234 198 L316 190 L322 244 L242 254 Z" />
      <path d="M14 158 L86 152 L92 190 L20 196 Z" />
      <path d="M350 172 L424 164 L432 216 L356 226 Z" />
      <path d="M398 20 L464 14 L472 64 L404 72 Z" />
    </g>

    <!-- здания -->
    <g fill="#F1EBDD" stroke="#E8E1D0" stroke-width="1.5">
      <rect x="150" y="128" width="22" height="20" rx="3" />
      <rect x="180" y="126" width="18" height="22" rx="3" />
      <rect x="206" y="124" width="24" height="16" rx="3" />
      <rect x="152" y="156" width="20" height="24" rx="3" />
      <rect x="180" y="158" width="26" height="20" rx="3" />
      <rect x="214" y="152" width="18" height="26" rx="3" />

      <rect x="258" y="100" width="24" height="22" rx="3" />
      <rect x="292" y="98" width="20" height="26" rx="3" />
      <rect x="320" y="96" width="16" height="20" rx="3" />
      <rect x="260" y="132" width="18" height="22" rx="3" />
      <rect x="288" y="134" width="26" height="18" rx="3" />

      <rect x="198" y="36" width="20" height="18" rx="3" />
      <rect x="226" y="34" width="24" height="22" rx="3" />
      <rect x="200" y="60" width="26" height="14" rx="3" />

      <rect x="244" y="208" width="22" height="18" rx="3" />
      <rect x="274" y="206" width="18" height="22" rx="3" />
      <rect x="300" y="204" width="16" height="18" rx="3" />
      <rect x="246" y="232" width="28" height="16" rx="3" />

      <rect x="24" y="164" width="20" height="18" rx="3" />
      <rect x="52" y="162" width="24" height="20" rx="3" />

      <rect x="360" y="182" width="22" height="20" rx="3" />
      <rect x="390" y="180" width="18" height="24" rx="3" />
      <rect x="362" y="208" width="26" height="14" rx="3" />
      <rect x="398" y="210" width="20" height="12" rx="3" />

      <rect x="408" y="28" width="20" height="18" rx="3" />
      <rect x="436" y="26" width="22" height="22" rx="3" />
      <rect x="410" y="52" width="26" height="14" rx="3" />
    </g>

    <!-- море: узкая полоса вдоль правого края -->
    <path
      d="M560 -10 C 548 60, 512 128, 472 176 C 436 220, 410 262, 400 310 L 580 310 L 580 -10 Z"
      fill="#A9D8F2"
    />
    <!-- песчаная полоса вдоль берега -->
    <path
      d="M560 -10 C 548 60, 512 128, 472 176 C 436 220, 410 262, 400 310"
      fill="none"
      stroke="#F3E7CD"
      stroke-width="8"
    />

    <!-- река: впадает в море -->
    <path
      d="M46 -14 C 62 46, 30 96, 66 148 C 100 198, 156 224, 214 258 C 262 282, 336 298, 402 312"
      fill="none"
      stroke="#A9D8F2"
      stroke-width="11"
      stroke-linecap="round"
    />

    <!-- второстепенные улицы: белые с едва заметной обводкой -->
    <g fill="none" stroke="#EFE8DA" stroke-width="5" stroke-linecap="round">
      <path d="M-10 74 C 66 66, 140 84, 212 72 C 284 60, 356 68, 430 56" />
      <path d="M118 112 L246 104" />
      <path d="M-10 196 C 56 190, 122 202, 178 192 C 242 182, 302 192, 354 184" />
      <path d="M196 -8 C 204 68, 190 140, 210 210 C 222 254, 216 286, 226 312" />
      <path d="M248 -8 C 256 46, 244 88, 268 128" />
      <path d="M206 268 C 254 264, 292 252, 318 236" />
      <path d="M74 -8 C 84 56, 68 128, 88 198" />
      <path d="M300 134 C 344 130, 392 142, 442 132" />
      <path d="M432 -8 C 440 50, 424 96, 440 152" />
      <path d="M366 236 C 400 246, 432 250, 462 244" />
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
      <path d="M-10 74 C 66 66, 140 84, 212 72 C 284 60, 356 68, 430 56" />
      <path d="M118 112 L246 104" />
      <path d="M-10 196 C 56 190, 122 202, 178 192 C 242 182, 302 192, 354 184" />
      <path d="M196 -8 C 204 68, 190 140, 210 210 C 222 254, 216 286, 226 312" />
      <path d="M248 -8 C 256 46, 244 88, 268 128" />
      <path d="M206 268 C 254 264, 292 252, 318 236" />
      <path d="M74 -8 C 84 56, 68 128, 88 198" />
      <path d="M300 134 C 344 130, 392 142, 442 132" />
      <path d="M432 -8 C 440 50, 424 96, 440 152" />
      <path d="M366 236 C 400 246, 432 250, 462 244" />
    </g>

    <!-- главные дороги: жёлтые с обводкой -->
    <g fill="none" stroke-linecap="round">
      <path d="M-10 238 C 68 234, 140 248, 210 236 C 284 224, 344 228, 404 254"
            stroke="#F2C27E" stroke-width="7.5" />
      <path d="M116 -12 C 130 78, 98 166, 124 312"
            stroke="#F2C27E" stroke-width="7.5" />
      <path d="M356 -12 C 368 60, 344 132, 368 202 C 384 252, 380 282, 390 312"
            stroke="#F2C27E" stroke-width="7.5" />
      <path d="M-10 238 C 68 234, 140 248, 210 236 C 284 224, 344 228, 404 254"
            stroke="#FBD9A0" stroke-width="4.5" />
      <path d="M116 -12 C 130 78, 98 166, 124 312"
            stroke="#FBD9A0" stroke-width="4.5" />
      <path d="M356 -12 C 368 60, 344 132, 368 202 C 384 252, 380 282, 390 312"
            stroke="#FBD9A0" stroke-width="4.5" />
    </g>

    <!-- шоссе -->
    <g fill="none" stroke-linecap="round">
      <path d="M-12 142 C 78 122, 162 182, 250 164 C 332 146, 392 106, 428 20"
            stroke="#E9A55F" stroke-width="9" />
      <path d="M-12 142 C 78 122, 162 182, 250 164 C 332 146, 392 106, 428 20"
            stroke="#F7BE7A" stroke-width="5.5" />
    </g>

    <!-- границы районов -->
    <path d="M170 -8 C 178 66, 160 128, 182 196 L 316 184"
          fill="none" stroke="#C9C0AE" stroke-width="1.5"
          stroke-dasharray="7 5" opacity="0.75" />
    <path d="M316 184 C 372 178, 420 194, 452 226"
          fill="none" stroke="#C9C0AE" stroke-width="1.5"
          stroke-dasharray="7 5" opacity="0.75" />
  </g>
</svg>
